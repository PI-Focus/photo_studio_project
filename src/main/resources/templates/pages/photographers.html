<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" 
      th:replace="~{fragments/layout :: main-layout(~{::main-content}, ~{::title}, ~{::#photographers-css})}">
<head>
    <th:block id="photographers-css">
        <link rel="stylesheet" th:href="@{/css/components.css}">
    </th:block>
    <title>Фотостудия «Фокус»</title>
</head>
<body>

    <div th:fragment="main-content">
        <h1>Добро пожаловать на страницу фотографов!</h1>
        
        <div th:if="${photographers.photographers != null && !photographers.photographers.isEmpty()}">
            <div th:each="item : ${photographers.photographers}">
                <div th:replace="~{fragments/components :: imaged-text-card(${item}, null, null)}"></div>
            </div>
        </div>
    </div>

</body>
</html>
