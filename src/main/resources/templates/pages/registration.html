<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" 
      th:replace="~{fragments/layout :: main-layout(~{::main-content}, ~{::title}, ~{::#login-css}, ~{})}">
<head>
    <th:block id="login-css">
        <link rel="stylesheet" th:href="@{/css/auth.css}" blocking="render">
    </th:block>
    <title>Фотостудия «Фокус»</title>
</head>
<body>

    <th:block th:fragment="main-content">
        <div class="auth-block">
            <h3>Регистрация</h3>

            <form th:action="@{/registration}" method="POST">
                <label for="login">Логин</label>
                <input type="text" id="login" name="login" placeholder="" required>

                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="" required>

                <label for="password-confirm">Повторите пароль</label>
                <input type="password" id="password-confirm" name="confirmPassword" placeholder="" required>

                <div class="submit-block">
                    <button type="submit" class="btn-submit">ЗАРЕГИСТРИРОВАТЬСЯ</button>
                    <a th:href="@{/login}" class="btn-switch-log-reg">ВОЙТИ</a>
                </div>
            </form>

            <th:block th:if="${error}">
                <p th:text="${error}" class="error-msg"></p>
            </th:block>
        </div>
    </th:block>

</body>
</html>
